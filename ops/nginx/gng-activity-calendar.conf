map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream gng_activity_calendar {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  # Replace with your domain later if needed. "_" also works for direct IP access.
  server_name _;

  client_max_body_size 20m;

  # The new recommended deployment path uses GitHub Actions over SSH,
  # so this legacy webhook endpoint can be blocked at the reverse proxy.
  location = /api/deploy {
    return 403;
  }

  location / {
    proxy_pass http://gng_activity_calendar;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
