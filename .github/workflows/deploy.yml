name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -n "${SERVER_HOST}" ]] || { echo "Missing secret: SERVER_HOST"; exit 1; }
          [[ -n "${SERVER_USER}" ]] || { echo "Missing secret: SERVER_USER"; exit 1; }
          [[ -n "${SERVER_SSH_KEY}" ]] || { echo "Missing secret: SERVER_SSH_KEY"; exit 1; }

          : "${SERVER_PORT:=22}"
          : "${SERVER_APP_DIR:=/opt/gng-activity-calendar}"

          {
            echo "SERVER_PORT=${SERVER_PORT}"
            echo "SERVER_APP_DIR=${SERVER_APP_DIR}"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SERVER_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts

      - name: Build Release Bundle
        shell: bash
        run: |
          set -Eeuo pipefail

          BUNDLE_PATH="${RUNNER_TEMP}/gng-activity-calendar-release.tgz"
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='.env' \
            --exclude='.cursor' \
            --exclude='ngrok' \
            --exclude='deploy.js' \
            --exclude='upload.js' \
            -czf "${BUNDLE_PATH}" .

          echo "BUNDLE_PATH=${BUNDLE_PATH}" >> "$GITHUB_ENV"

      - name: Upload Release Bundle
        shell: bash
        run: |
          set -Eeuo pipefail

          scp -i ~/.ssh/id_ed25519 -P "${SERVER_PORT}" \
            "${BUNDLE_PATH}" \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/gng-activity-calendar-release.tgz"

      - name: Run Remote Deploy Script
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh -i ~/.ssh/id_ed25519 -p "${SERVER_PORT}" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "APP_DIR='${SERVER_APP_DIR}' RELEASE_TGZ='/tmp/gng-activity-calendar-release.tgz' RELEASE_DIR='/tmp/gng-activity-calendar-release' PROCESS_NAME='gng-activity-calendar' bash -s" \
            < ops/deploy.sh

      - name: Clean Up SSH Key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
